name: CineWave Android v7 release build

on:
  push:
    branches: [main, tmdb-attribution-audit, tmdb-performance]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinewave-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore archived source only for an empty bootstrap repository
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pubspec.yaml && -f lib/main.dart ]]; then
            echo "Committed Flutter source tree found; building the current source."
          else
            mkdir -p /tmp/cineflix-source
            cat .cineflix_bundle/part-*.b64 | base64 --decode | tar -xz -C /tmp/cineflix-source
            test -f /tmp/cineflix-source/pubspec.yaml
            test -f /tmp/cineflix-source/lib/main.dart
            cp -a /tmp/cineflix-source/. .
            rm -rf /tmp/cineflix-source
          fi
          rm -rf .cineflix_bundle
          python3 - <<'PYCODE'
          from pathlib import Path
          home = Path('lib/screens/home_screen.dart')
          if home.exists():
              source = home.read_text()
              source = source.replace('destinations: const [', 'destinations: [')
              home.write_text(source)
          PYCODE

      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.teinzz --project-name cineflix_ultra .

      - name: Apply Android network permission and supported minimum SDK
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
              )
          manifest.write_text(text)
          gradle_kts = Path('android/app/build.gradle.kts')
          gradle = Path('android/app/build.gradle')
          if gradle_kts.exists():
              source = gradle_kts.read_text()
              gradle_kts.write_text(source.replace('minSdk = flutter.minSdkVersion', 'minSdk = 24'))
          elif gradle.exists():
              source = gradle.read_text()
              gradle.write_text(source.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 24'))
          else:
              raise SystemExit('Could not find Android app Gradle file.')
          PYCODE

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Validate bundled catalogue and declared playback URLs
        run: python3 scripts/verify_media_endpoints.py

      - name: Set Android application label
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          source = source.replace('android:label="CINEFLIX Ultra"', 'android:label="CineWave"')
          path.write_text(source)
          PYCODE

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos

      - name: Run automated tests
        run: flutter test --reporter expanded

      - name: Build universal release APK
        env:
          TMDB_API_KEY2: ${{ secrets.TMDB_API_KEY2 }}
        shell: bash
        run: |
          if [[ -z "${TMDB_API_KEY2}" ]]; then
            echo 'TMDB_API_KEY2 GitHub Actions secret is missing.' >&2
            exit 1
          fi
          flutter build apk --release --dart-define=TMDB_API_KEY2="${TMDB_API_KEY2}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinewave-v7-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK as GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cinewave-v7.1.0-build-${{ github.run_number }}
          name: CineWave v7.1.0 build ${{ github.run_number }}
          body: |
            Automated Android release build of CineWave 7.1.0.
            Live catalogue metadata is powered by TMDB. TMDB does not provide video streams; in-app playback is limited to separately configured authorized sources. Provider availability links are region dependent.
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
