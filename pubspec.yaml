name: cineflix_ultra
version: 6.0.0+6
description: CineWave - licensed open-movie catalogue and adaptive streaming player.
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  video_player: ^2.14.1
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  google_fonts: ^6.3.2
  shimmer: ^3.0.0
  lottie: ^3.3.2
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.2
  connectivity_plus: ^7.3.2
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1
  flutter_svg: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/config/servers.json
    - assets/database/all_content.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_logo.png
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/images/app_logo.png
  min_sdk_android: 24
